# GeM Bid Eligibility Verification Platform (SIH26100)
# Hosted Demonstration Deployment Descriptor (Render / Sovereign Infrastructure Blueprint)
# IMPORTANT: This hosted demo blueprint is provided for evaluation convenance.
# The platform is strictly designed for on-premises deployment in sovereign government data centers.

services:
  - type: web
    name: gem-bid-verification-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: GEM_ENVIRONMENT
        value: demo_hosted
      - key: GEM_SECURITY_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gem-bid-verification-db
          property: connectionString
    healthCheckPath: /api/health

  - type: web
    name: gem-bid-verification-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: singapore
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: node dist-server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FASTAPI_URL
        fromService:
          type: web
          name: gem-bid-verification-api
          property: host
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: gem-bid-verification-db
    databaseName: gem_verification
    plan: free
    region: singapore

